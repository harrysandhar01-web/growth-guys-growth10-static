name: Owner publish current GROWTH10
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm authenticated owner and main branch
        env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$ACTOR" != "harrysandhar01-web" || "$REF" != "refs/heads/main" ]]; then
            echo "::error::Publication requires the authorized owner on main; actor=$ACTOR ref=$REF"
            exit 1
          fi
  publish:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select existing accepted current record without a fresh checkout
        id: current
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('public/api/current-record.json','utf8'));
          const state=JSON.parse(fs.readFileSync('public/owner-publication-state.json','utf8'));
          if(r.code!=='GROWTH10'||!r.record_reference||!r.observed_at||r.publication_phase!=='owner_accepted'||state.latest!==r.record_reference)throw Error('No matching accepted current record; refusing to replace verification history');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'record_reference='+r.record_reference+'\n');
          console.log('Reusing accepted current record '+r.record_reference);
          NODE
      - name: Regenerate public projections from the same accepted record
        run: |
          python3 scripts/project-existing-current-record.py
          node scripts/build-public-record-indexes.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Confirm current record and all public variants
        env:
          SITE_CODE: GROWTH10
          SITE_ORIGIN: https://growthguysgrowth10.ca
        run: node scripts/confirm-live-publication.mjs
